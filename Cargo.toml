[package]
name = "shard"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime (rt-multi-thread + macros required for #[tokio::main])
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# HTTP client
reqwest = { version = "0.12", features = ["stream", "rustls-tls"] }

# Logging & diagnostics
tracing = "0.1"
# env-filter feature enables .with_env_filter()
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1"

# (Future steps will use these; keeping them now avoids dependency churn)
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
rand = "0.8"
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
chrono = { version = "0.4", features = ["serde"] }