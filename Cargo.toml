[package]
name = "shard"
version = "0.1.0"
edition = "2021"
authors = ["sujal-nath"]
description = "High-performance terminal download manager"
repository = "https://github.com/nathsujal/shard"
license = "MIT"

[[bin]]
name = "shard"
path = "src/main.rs"

[dependencies]
# Async runtime — added "net" for UnixStream/UnixListener
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "net"] }

# HTTP
reqwest = { version = "0.11", features = ["stream"] }
futures-util = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Progress UI
indicatif = "0.17"

# Error handling
thiserror = "1"
anyhow = "1"

# Config + serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# SQLite persistence (daemon job store)
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-native-tls", "macros"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"

# TUI
ratatui = "0.26"
crossterm = "0.27"

# System dirs (~/.config, ~/Downloads, ~/.local/share)
dirs = "5"